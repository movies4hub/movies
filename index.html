<!DOCTYPE html>
<html>

<head>

<title>Movies4Hub – Watch Movies Info & Search Movies</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="wnu53yjciNV-BA2TnZ3c06YykgPCBSgS1znA3L1zgzI" />

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
🎬 Movie Finder
</header>

<div class="search-box">

<input 
id="movieName"
placeholder="Search movie..."
onkeypress="if(event.key==='Enter'){searchMovie()}">

<button onclick="searchMovie()">Search</button>

</div>

<div id="result"></div>



<h2>🔥 Trending Movies</h2>

<div class="slider">

<button class="arrow left" onclick="scrollLeft()">❮</button>

<div id="trending" class="trending-row"></div>

<button class="arrow right" onclick="scrollRight()">❯</button>

</div>


<script src="script.js"></script>

</body>

</html>
